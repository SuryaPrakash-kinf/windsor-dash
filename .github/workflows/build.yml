name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04   # has the Android SDK preinstalled
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'

      - name: Build
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Render screenshots
        id: shots
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest --tests '*ScreenshotTest*' --tests '*ChargePlannerTest*' 2>&1 | tee shots.log

      - name: Publish screenshots
        if: always()
        continue-on-error: true
        run: |
          mkdir -p /tmp/shots; cp app/build/screens/*.png /tmp/shots/ 2>/dev/null || true
          grep -E "^e: |FAILED|Exception|What went wrong|PLAN " shots.log | head -80 > /tmp/shots/log.txt 2>/dev/null || true
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git stash -u -q || true
          git checkout --orphan ci-shots
          git rm -rfq --cached . >/dev/null
          cp /tmp/shots/* .
          git add -f *.png log.txt 2>/dev/null || git add -f log.txt
          git commit -qm "build ${{ github.run_number }} screenshots"
          git push -f origin ci-shots
          git checkout -q -f main

      - name: Publish build log on failure
        if: failure()
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          grep -E "^e: |error:|What went wrong|^> |FAILURE|Could not" build.log | head -80 > errors.txt || true
          cp build.log full.log 2>/dev/null || true
          git checkout --orphan ci-log
          git rm -rfq --cached . >/dev/null
          git add -f errors.txt full.log
          git commit -qm "build ${{ github.run_number }} log"
          git push -f origin ci-log

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk WindsorDash-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WindsorDash-apk
          path: WindsorDash-*.apk

      - name: Publish as a release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Windsor Dash build ${{ github.run_number }}
          files: WindsorDash-*.apk
